# Candidate only. This file is not installed by secDNS. It becomes eligible for
# trustedProxySources=["127.0.0.1"] only after OS/authenticated-intermediary
# controls prevent every process except this nginx worker from reaching 18056.
server {
    listen 100.91.1.82:443 ssl;
    server_name secdns.aircloud.pro;

    ssl_certificate /etc/letsencrypt/live/secdns.aircloud.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secdns.aircloud.pro/privkey.pem;

    # Only Facade may translate its sanitized singleton X-Forwarded-For into
    # nginx's validated remote address. Other clients retain their socket IP.
    set_real_ip_from 100.91.1.47/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    if ($host != secdns.aircloud.pro) { return 421; }

    location /admin/ {
        proxy_pass http://127.0.0.1:18056;
        proxy_http_version 1.1;
        proxy_set_header Host secdns.aircloud.pro;

        # Discard client-supplied identity and reconstruct one exact tuple.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host secdns.aircloud.pro;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Client-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Client-Cert "";
        proxy_set_header X-SSL-Client-Cert "";

        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / { return 404; }
}
